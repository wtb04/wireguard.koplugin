name: Tests

on: [push, pull_request]

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install Lua 5.1
              run: sudo apt-get update && sudo apt-get install -y lua5.1

            - name: Run tests
              run: lua5.1 tests/run.lua
