name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Read the tag message
              run: |
                  set -eu
                  notes=
                  if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
                      notes=$(git tag -l \
                          --format='%(contents:subject)%0a%0a%(contents:body)' \
                          "$GITHUB_REF_NAME")
                  fi
                  delim="NOTES_EOF_${GITHUB_RUN_ID}"
                  {
                    echo "NOTES<<${delim}"
                    echo "$notes"
                    echo "${delim}"
                  } >> "$GITHUB_ENV"

            - name: Build plugin zip
              run: |
                  set -eu
                  mkdir -p dist staging/wireguard.koplugin/configs
                  cp _meta.lua main.lua LICENSE README.md staging/wireguard.koplugin/
                  cp configs/.gitkeep staging/wireguard.koplugin/configs/
                  (cd staging && zip -r "../dist/wireguard.koplugin-${GITHUB_REF_NAME}.zip" wireguard.koplugin)

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                  files: dist/*.zip
                  body: ${{ env.NOTES }}
                  generate_release_notes: true
