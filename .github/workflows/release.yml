name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Read the tag message
              run: |
                  {
                    echo 'NOTES<<RELEASE_NOTES_EOF'
                    git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
                    echo RELEASE_NOTES_EOF
                  } >> "$GITHUB_ENV"

            - name: Build plugin zip
              run: |
                  set -eu
                  mkdir -p dist staging/wireguard.koplugin/configs
                  cp _meta.lua main.lua LICENSE README.md staging/wireguard.koplugin/
                  cp configs/.gitkeep staging/wireguard.koplugin/configs/
                  (cd staging && zip -r "../dist/wireguard.koplugin-${GITHUB_REF_NAME}.zip" wireguard.koplugin)

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                  files: dist/*.zip
                  body: ${{ env.NOTES }}
                  generate_release_notes: true
