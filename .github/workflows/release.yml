name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Build plugin zip
              run: |
                  set -eu
                  cp LICENSE wireguard.koplugin/LICENSE
                  mkdir -p dist
                  zip -r "dist/wireguard.koplugin-${GITHUB_REF_NAME}.zip" wireguard.koplugin \
                    --exclude 'wireguard.koplugin/configs/*.conf'

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                  files: dist/*.zip
                  generate_release_notes: true
